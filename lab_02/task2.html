<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2 - Пори року</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 20px;
        }
        
        /* Маркер для списку першого рівня */
        ul.seasons {
            list-style-image: url('images/arrow.png'); 
        }

        /* Маркери для вкладених списків відповідних пір року */
        ul.winter {
            list-style-image: url('images/snowflake.png');
        }

        ul.spring {
            list-style-image: url('images/leaf.png');
        }

        ul.summer {
            list-style-image: url('images/sun.png');
        }

        ul.autumn {
            list-style-image: url('images/maple.png');
        }

        /* Відступи для вкладених списків */
        ul {
            margin-top: 5px;
            margin-bottom: 5px;
            padding-left: 30px;
        }
    </style>
</head>
<body>

    <ul class="seasons">
        <li>Winter
            <ul class="winter">
                <li>December</li>
                <li>January</li>
                <li>February</li>
            </ul>
        </li>
        <li>Spring
            <ul class="spring">
                <li>March</li>
                <li>April</li>
                <li>May</li>
            </ul>
        </li>
        <li>Summer
            <ul class="summer">
                <li>June</li>
                <li>July</li>
                <li>August</li>
            </ul>
        </li>
        <li>Autumn
            <ul class="autumn">
                <li>September</li>
                <li>October</li>
                <li>November</li>
            </ul>
        </li>
    </ul>

</body>
</html>
